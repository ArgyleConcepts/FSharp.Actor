name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
          global-json-file: global.json
      - name: Derive version from release tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build ArgyleConcepts.FSharp.Actor.slnx -c Release -p:Version=$VERSION
      - run: dotnet test --project tests/ArgyleConcepts.FSharp.Actor.Tests -c Release --no-build --minimum-expected-tests 56
      - run: dotnet pack src/ArgyleConcepts.FSharp.Actor -c Release --no-build -p:Version=$VERSION -o artifacts
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
