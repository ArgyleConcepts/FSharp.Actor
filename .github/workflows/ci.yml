name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
          global-json-file: global.json
      - run: dotnet build ArgyleConcepts.FSharp.Actor.slnx -c Release
      - run: dotnet test --project tests/ArgyleConcepts.FSharp.Actor.Tests -c Release --no-build --minimum-expected-tests 56
      - run: dotnet pack src/ArgyleConcepts.FSharp.Actor -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
