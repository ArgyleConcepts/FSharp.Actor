name: Feature request
description: Propose an improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe what you are trying to accomplish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example API or usage if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and compatibility
      description: Mention workarounds considered and possible breaking changes.
